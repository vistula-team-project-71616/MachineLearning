seed: 42

data:
  path: "data"
  batch_size: 128
  num_workers: 0
  train_size: 55000
  val_size: 5000

model:
  name: "CNN"
  input_channels: 1
  num_classes: 10

training:
  epochs: 5
  learning_rate: 0.001
  optimizer: "Adam"

checkpoint:
  directory: "checkpoints"
  filename: "best_model.pth"

mlflow:
  experiment_name: "Lab6_FashionMNIST"
  run_name: "CNN_baseline"